name: windows
on:
  push:
    paths: ["app/**", "install.ps1", ".github/**"]
  workflow_dispatch:
jobs:
  install-and-run:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install (like a user would, in Windows PowerShell)
        shell: cmd
        env:
          VOID_CI: "1"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
      - name: Smoke test
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\ci\smoke.ps1
      - name: Pictures and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ci
          path: ci-out
          retention-days: 14
