name: installer
# Builds VoidSetup.exe (and tests it on a clean Windows machine), the .deb (installed and run on Ubuntu) and the Arch
# package. Pushing a tag like v1.0.0 also publishes VoidSetup.exe and the .deb on that release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["installer/**", "app/**", "install.ps1", "install.sh", "bin/**", "data/**", "meson.build", "packaging/**",
            ".github/workflows/installer.yml", ".github/ci/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wizard pictures and icon
        run: |
          python -m pip install --quiet pillow
          python installer/make_art.py
      - name: Build VoidSetup.exe
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { (Get-Content app\VERSION -TotalCount 1).Trim() }
          [IO.File]::WriteAllText("$pwd\app\VERSION", $version)            # what Void reports and compares for updates
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" installer\void.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install as a normal (non-admin) user, then update over it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $out = "C:\voidtest"
          New-Item -ItemType Directory -Force $out | Out-Null
          icacls $out /grant "Everyone:(OI)(CI)F" | Out-Null
          Copy-Item dist\VoidSetup.exe, .github\ci\user-install.ps1 $out
          $pw = "Vt1!" + [guid]::NewGuid().ToString("N").Substring(0, 9)   # net user stops to ask about passwords over 14 characters
          net user voidtest $pw /add
          if ($LASTEXITCODE) { exit 1 }
          net localgroup "Performance Log Users" voidtest /add | Out-Null   # lets it run as a scheduled task; still not an admin
          # a scheduled task gives the test user a real logon with its own desktop (Start-Process -Credential doesn't)
          $action = New-ScheduledTaskAction -Execute powershell.exe -WorkingDirectory $out `
            -Argument "-NoProfile -ExecutionPolicy Bypass -File $out\user-install.ps1 -Setup $out\VoidSetup.exe -Out $out"
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 40)
          Register-ScheduledTask VoidUserInstall -Action $action -Settings $settings -User "$env:COMPUTERNAME\voidtest" -Password $pw -RunLevel Limited | Out-Null
          Start-ScheduledTask VoidUserInstall
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep 10
            if ((Get-Content "$out\user-results.txt" -ErrorAction SilentlyContinue) -contains "DONE") { break }
            $last = (Get-ScheduledTaskInfo VoidUserInstall).LastTaskResult   # 267009 = running, 267011 = not started yet
            if ($i -gt 6 -and $last -ne 267009 -and (Get-ScheduledTask VoidUserInstall).State -ne "Running") { "task stopped: $last"; break }
          }
          Copy-Item "$out\*.txt", "$out\*.log" ci-out -ErrorAction SilentlyContinue
          $r = Get-Content "$out\user-results.txt" -ErrorAction SilentlyContinue
          $r
          if (-not ($r -contains "DONE") -or ($r -match "^FAIL")) { exit 1 }
      - name: Install with VoidSetup.exe (silent, admin)
        shell: pwsh
        env:
          VOID_CI: "1"
        run: |
          $p = Start-Process dist\VoidSetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", '/TASKS=""', "/LOG=$pwd\ci-out\setup.log" -Wait -PassThru
          "setup exit code: $($p.ExitCode)"
          if ($p.ExitCode) { exit 1 }
      - name: Smoke test
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\ci\smoke.ps1
      - name: Self-update ("Update now")
        shell: pwsh
        env:
          VOID_CI: "1"
        run: |
          $root = "$env:LOCALAPPDATA\void"
          $setup = (Resolve-Path dist\VoidSetup.exe).Path
          $json = Join-Path $pwd "ci-out\release.json"
          # a pretend "latest release" that points at the setup just built
          @{ tag_name = "v99.0.0"; html_url = "https://github.com/PLAYER99-void/void/releases";
             assets = @(@{ name = "VoidSetup.exe"; browser_download_url = "file:///" + ($setup -replace '\\', '/') }) } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 $json
          $env:VOID_UPDATE_URL = "file:///" + ($json -replace '\\', '/')
          function Up { try { Invoke-RestMethod http://127.0.0.1:47777/api/state -TimeoutSec 2 | Out-Null; $true } catch { $false } }
          & "$root\bin\void.cmd" stop
          for ($i = 0; $i -lt 30 -and (Up); $i++) { Start-Sleep 1 }
          "server down before the test: $(-not (Up))"
          $built = (Get-Content "$root\app\VERSION" -TotalCount 1).Trim()
          [IO.File]::WriteAllText("$root\app\VERSION", "0.0.1")                              # pretend it's old
          "VERSION file now: $(Get-Content "$root\app\VERSION")  (built: $built)"
          & "$root\bin\void.cmd" show
          for ($i = 0; $i -lt 60 -and -not (Up); $i++) { Start-Sleep 1 }
          "server reports version: $((Invoke-RestMethod http://127.0.0.1:47777/api/state).version)"
          Get-CimInstance Win32_Process -Filter "Name like 'python%'" | ForEach-Object { "  proc $($_.ProcessId): $($_.CommandLine)" }
          $h = @{ "X-Void-Token" = (Get-Content "$root\runtime.json" | ConvertFrom-Json).token }
          $c = Invoke-RestMethod -Method Post http://127.0.0.1:47777/api/update/check -Headers $h -ContentType application/json -Body "{}"
          $fails = 0
          if ($c.newer -and $c.current -eq "0.0.1") { "PASS  sees v$($c.latest) is newer than v$($c.current)" } else { "FAIL  update check: $($c | ConvertTo-Json -Compress)"; $fails++ }
          Invoke-RestMethod -Method Post http://127.0.0.1:47777/api/update -Headers $h -ContentType application/json -Body "{}" | Out-Null
          $deadline = (Get-Date).AddMinutes(10)
          do { Start-Sleep 5; $v = (Get-Content "$root\app\VERSION" -TotalCount 1 -ErrorAction SilentlyContinue) } while (((-not $v) -or $v.Trim() -eq "0.0.1" -or -not (Up)) -and (Get-Date) -lt $deadline)
          if ($v -and $v.Trim() -eq $built) { "PASS  updated to v$built" } else { "FAIL  version after update: $v"; $fails++ }
          $back = $false; for ($i = 0; $i -lt 60 -and -not $back; $i++) { $back = Up; if (-not $back) { Start-Sleep 2 } }
          if ($back) { "PASS  Void started again by itself" } else { "FAIL  server didn't come back"; $fails++ }
          if ($fails) { "--- update-setup.log"; Get-Content "$root\update-setup.log" -Tail 25 -ErrorAction SilentlyContinue; "--- server.log"; Get-Content "$root\server.log" -Tail 15 -ErrorAction SilentlyContinue }
          & "$root\bin\void.cmd" stop
          exit $fails
      - name: Uninstall
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\void"
          Start-Process "$root\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $root); $i++) { Start-Sleep 2 }   # the uninstaller finishes from a copy in %TEMP%
          $fails = 0
          if (Test-Path $root) { "FAIL  $root is still there"; $fails++ } else { "PASS  install folder removed" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Void.lnk") { "FAIL  Start menu shortcut left"; $fails++ } else { "PASS  Start menu shortcut removed" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Void.lnk") { "FAIL  start-at-login left"; $fails++ } else { "PASS  start-at-login removed" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -like "*$root\bin*") { "FAIL  still on PATH"; $fails++ } else { "PASS  PATH cleaned" }
          exit $fails
      - name: Installer and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VoidSetup
          retention-days: 14
          path: |
            dist/VoidSetup.exe
            ci-out

  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build void-claude.deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build
          if [ "$GITHUB_REF_TYPE" = tag ]; then printf '%s' "${GITHUB_REF_NAME#v}" > app/VERSION; fi
          bash packaging/deb/build.sh dist
          ls -l dist
      - name: Install it, run "void setup", and start Void's server from the package
        run: |
          sudo apt-get install -y ./dist/void-claude_*_all.deb
          test -x /usr/bin/void && test -f /usr/share/void/app/server.py && echo "PASS  files in place"
          void setup
          test -x ~/.local/share/void/venv/bin/python && echo "PASS  void setup made the Python environment"
          ~/.local/share/void/venv/bin/python /usr/share/void/app/server.py > server.log 2>&1 &
          for i in $(seq 60); do curl -fs http://127.0.0.1:47777/api/state > /dev/null && break; sleep 1; done
          python3 - <<'PY'
          import json, os, sys, urllib.request
          tok = json.load(open(os.path.expanduser("~/.local/share/void/runtime.json")))["token"]
          s = json.load(urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:47777/api/state",
                                                                      headers={"X-Void-Token": tok})))
          ok = s.get("version") not in (None, "0.0.0") and s["update"]["how"] == "package"
          print(("PASS" if ok else "FAIL") + f"  server answers: version {s.get('version')}, updates via {s['update']['how']}")
          sys.exit(0 if ok else 1)
          PY
      - name: His window on X11 (Xvfb) — the top bar docks on each edge
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"   # (test machine: no user namespaces for WebKit's sandbox)
        run: |
          sudo apt-get install -y -qq xvfb dbus-x11 >/dev/null
          mkdir -p ci-out
          curl -fs http://127.0.0.1:47777/api/state > /dev/null || { ~/.local/share/void/venv/bin/python /usr/share/void/app/server.py >> server.log 2>&1 & sleep 8; }
          for e in top bottom left; do
            env -u WAYLAND_DISPLAY GDK_BACKEND=x11 VOID_NO_LAYER=1 dbus-run-session -- \
              xvfb-run -a -s "-screen 0 1280x800x24" /usr/bin/python3 /usr/share/void/app/window.py \
              "http://127.0.0.1:47777/?native=1" --selftest-bar $e ci-out/bar-$e.png 2>>ci-out/window.log | tee -a ci-out/bar.txt
          done
          python3 - <<'PY'
          import re, sys
          fails = 0
          for edge in ("top", "bottom", "left"):
              m = [re.search(r"selftest-bar: (\w+) x=(-?\d+) y=(-?\d+) w=(\d+) h=(\d+) area=(-?\d+),(-?\d+),(\d+),(\d+) layer=(\w+) page=(.*)", l)
                   for l in open("ci-out/bar.txt") if l.startswith(f"selftest-bar: {edge} ")]
              m = m[-1] if m else None
              ok = False
              if m:
                  x, y, w, h, ax, ay, aw, ah = map(int, m.groups()[1:9])
                  cls = m.group(11).split()
                  where = {"top": abs(x - (ax + (aw - w) / 2)) <= 2 and y == ay,
                           "bottom": abs(x - (ax + (aw - w) / 2)) <= 2 and abs(y + h - (ay + ah)) <= 1,
                           "left": x == ax and abs(y - (ay + (ah - h) / 2)) <= 2}[edge]
                  ok = where and "bar" in cls and f"e-{edge}" in cls
              print(("PASS" if ok else "FAIL") + f"  top bar docks on the {edge} edge (X11)  {m.group(0) if m else 'no report'}")
              fails += not ok
          sys.exit(fails)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-window
          retention-days: 14
          path: |
            ci-out
            server.log
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          retention-days: 14
          path: dist/*.deb

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the AUR package (void-claude-git)
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson
          useradd -m builder
          cp -r packaging/arch/void-claude-git /home/builder/pkg && chown -R builder /home/builder/pkg
          su builder -c "cd ~/pkg && makepkg --nodeps --noconfirm"
          ls /home/builder/pkg/*.pkg.tar.zst
          pacman -Qlp /home/builder/pkg/*.pkg.tar.zst | grep -E "usr/bin/void$|usr/share/void/app/server.py$"

  publish:
    if: github.ref_type == 'tag'
    needs: [build, deb, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: art
      - name: Publish on the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            art/VoidSetup/dist/VoidSetup.exe
            art/deb/*.deb
          generate_release_notes: true
