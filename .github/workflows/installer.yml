name: installer
# Builds VoidSetup.exe, installs Void with it on a clean Windows machine, runs the smoke test, then uninstalls.
# Pushing a tag like v1.0.0 also publishes VoidSetup.exe on that release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["installer/**", "app/**", "install.ps1", ".github/workflows/installer.yml", ".github/ci/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Icon
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('app/static/icon.png').save('installer/void.ico', sizes=[(256,256),(64,64),(48,48),(32,32),(16,16)])"
      - name: Build VoidSetup.exe
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" installer\void.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install with VoidSetup.exe (silent)
        shell: pwsh
        env:
          VOID_CI: "1"
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $p = Start-Process dist\VoidSetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$pwd\ci-out\setup.log" -Wait -PassThru
          "setup exit code: $($p.ExitCode)"
          if ($p.ExitCode) { exit 1 }
      - name: Smoke test
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\ci\smoke.ps1
      - name: Uninstall
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\void"
          Start-Process "$root\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $root); $i++) { Start-Sleep 2 }   # the uninstaller finishes from a copy in %TEMP%
          $fails = 0
          if (Test-Path $root) { "FAIL  $root is still there"; $fails++ } else { "PASS  install folder removed" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Void.lnk") { "FAIL  Start menu shortcut left"; $fails++ } else { "PASS  Start menu shortcut removed" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\Void.lnk") { "FAIL  start-at-login left"; $fails++ } else { "PASS  start-at-login removed" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -like "*$root\bin*") { "FAIL  still on PATH"; $fails++ } else { "PASS  PATH cleaned" }
          exit $fails
      - name: Installer and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoidSetup
          path: |
            dist/VoidSetup.exe
            ci-out
      - name: Publish on the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoidSetup.exe
          generate_release_notes: true
