name: one-line installer
# Runs get.sh for real, as a normal user, on clean Ubuntu, Fedora and Arch machines: the package way (downloads the
# latest release's package) and the source way (git clone + install.sh). Then starts Void's server and checks it.
# Run it after a release is published: Actions → one-line installer → Run workflow.
on:
  workflow_dispatch:
jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        mode: [package, source]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: get.sh --${{ matrix.mode }} (as the runner's own user, which has sudo)
        run: |
          bash get.sh --${{ matrix.mode }}
          if [ "${{ matrix.mode }}" = source ]; then app=~/.local/share/void/app; want=git; else app=/usr/share/void/app; want=deb; fi
          nohup ~/.local/share/void/venv/bin/python "$app/server.py" > /tmp/server.log 2>&1 &
          python3 .github/ci/pkgcheck.py $want || { tail -n 30 /tmp/server.log; exit 1; }

  containers:
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, arch]
        mode: [package, source]
    runs-on: ubuntu-latest
    container: ${{ matrix.distro == 'fedora' && 'fedora:latest' || 'archlinux:latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: A normal user with sudo (like on a desktop)
        run: |
          if [ "${{ matrix.distro }}" = fedora ]; then dnf install -y -q sudo curl; else pacman -Syu --noconfirm --needed sudo curl; fi
          useradd -m tester && echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          cp get.sh .github/ci/pkgcheck.py /tmp/ && chmod 755 /tmp/get.sh /tmp/pkgcheck.py
      - name: get.sh --${{ matrix.mode }} (as that user)
        run: |
          su - tester -c "bash /tmp/get.sh --${{ matrix.mode }}"
          if [ "${{ matrix.mode }}" = source ]; then app='$HOME/.local/share/void/app'; want=git
          else app=/usr/share/void/app; want=$([ "${{ matrix.distro }}" = fedora ] && echo rpm || echo arch); fi
          su - tester -c "nohup \$HOME/.local/share/void/venv/bin/python $app/server.py > /tmp/server.log 2>&1 &"
          su - tester -c "python3 /tmp/pkgcheck.py $want" || { tail -n 30 /tmp/server.log; exit 1; }
